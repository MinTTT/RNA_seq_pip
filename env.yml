name: bioinfo
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.12
  - pysam
  - pandas
  - numpy
  - matplotlib
  - tqdm
  - joblib
  - scipy
  - htseq
  - biopython
  - samtools
  - bowtie2
  - trimmomatic
  - cutadapt
  - seaborn
  - scikit-learn
  - pip
  - fastp=1.1.0
  - pip:
    - pysamstats